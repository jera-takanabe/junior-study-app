<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>音声操作 先行検証 | junior-study-app</title>
<style>
:root{font-family:system-ui,-apple-system,"Noto Sans JP",sans-serif;color:#172335;background:#f5f8fc}
body{margin:0;padding:16px}main{max-width:680px;margin:auto}
h1{font-size:1.5rem}h2{font-size:1.18rem;margin:8px 0}
section{background:#fff;border:1px solid #d5dfec;border-radius:12px;padding:16px;margin:14px 0}
button{font-size:1rem;padding:12px 16px;border-radius:9px;border:0;background:#135baa;color:white;margin:4px;min-height:44px}
button:disabled{opacity:.55}button.secondary{background:#56657a}
.status{font-weight:700;color:#135baa}.muted{color:#4a5970}
.options{line-height:1.8}audio{width:100%}pre{white-space:pre-wrap;overflow-wrap:anywhere;font-size:.83rem;background:#f4f6f9;padding:10px}
#questionText{font-size:1.2rem;line-height:1.6}li{margin:9px 0}
</style>
</head>
<body><main>
<h1>音声操作・先行検証</h1>
<p class="muted">一度開始したら、問題読み上げ → 発話録音（5秒）→ 次問を3問続けます。文字起こし・採点・送信は行いません。</p>
<section>
<p id="support" role="status">機能を確認中…</p>
<button id="start">音声練習を開始</button>
<button id="stop" class="secondary" disabled>中止</button>
<p class="status" id="status" aria-live="polite">開始待ち</p>
<p id="progress">0 / 3 問</p>
</section>
<section>
<h2>問題</h2>
<div id="questionText">開始すると表示されます。</div>
<div class="options" id="options"></div>
</section>
<section>
<h2>録音結果</h2>
<p class="muted">終了後、録音を再生して声の途切れ・読み上げ音の混入を確認してください。録音はサーバーに送信しません。</p>
<ol id="results"></ol>
</section>
<section><details><summary>進行ログ（問題が止まったときの確認用）</summary><pre id="log"></pre></details></section>
</main>
<script>
"use strict";
const questions = [
  {text:"日本の首都はどこですか。1番、大阪。2番、東京。3番、京都。4番、福岡。", display:"日本の首都はどこですか。", choices:["1. 大阪","2. 東京","3. 京都","4. 福岡"], expected:"2番"},
  {text:"反比例でエックスを2倍にすると、ワイは何倍になりますか。", display:"反比例で x を2倍にすると、y は何倍になりますか。", expected:"0.5倍"},
  {text:"水が固体になったものは何ですか。", display:"水が固体になったものは何ですか。", expected:"氷"}
];
const $ = id => document.getElementById(id);
const wait = ms => new Promise(resolve => setTimeout(resolve, ms));
let runId=0, active=false, recorder=null, stream=null, recordings=[], currentUrls=[];
function log(message){ const time=new Date().toLocaleTimeString("ja-JP"); $("log").textContent += "["+time+"] "+message+"\n"; }
function status(message){ $("status").textContent=message; log(message); }
function releaseStream(){ if(stream){stream.getTracks().forEach(t=>t.stop());stream=null;} }
function cleanup(){try{if(recorder && recorder.state!=="inactive")recorder.stop();}catch(e){} recorder=null;releaseStream();window.speechSynthesis?.cancel();}
function buttons(running){$("start").disabled=running;$("stop").disabled=!running;}
function showQuestion(i){$("progress").textContent=(i+1)+" / "+questions.length+" 問";$("questionText").textContent=questions[i].display;$("options").replaceChildren();for(const v of questions[i].choices||[]){const p=document.createElement("div");p.textContent=v;$("options").append(p);}}
function chooseMime(){for(const type of ["audio/mp4","audio/webm;codecs=opus","audio/webm"]){if(MediaRecorder.isTypeSupported(type))return type;}return "";}
function speak(text,token){
 return new Promise((resolve,reject)=>{
  if(token!==runId)return reject(new Error("中止"));
  let done=false;const finish=(err)=>{if(done)return;done=true;clearTimeout(watchdog);err?reject(err):resolve();};
  const utterance=new SpeechSynthesisUtterance(text);utterance.lang="ja-JP";utterance.rate=.9;
  utterance.onend=()=>finish();utterance.onerror=e=>finish(new Error("読み上げ失敗: "+e.error));
  const watchdog=setTimeout(()=>finish(new Error("読み上げ完了を検出できませんでした")),30000);
  window.speechSynthesis.cancel();window.speechSynthesis.speak(utterance);
 });
}
async function capture(token){
 if(token!==runId)throw new Error("中止");
 stream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true}});
 if(token!==runId){releaseStream();throw new Error("中止");}
 const mime=chooseMime();const options=mime?{mimeType:mime}:undefined;
 const chunks=[];const media=new MediaRecorder(stream,options);recorder=media;
 return await new Promise((resolve,reject)=>{
  let settled=false,timer;
  function end(err){if(settled)return;settled=true;clearTimeout(timer);releaseStream();recorder=null;if(err)reject(err);else resolve(new Blob(chunks,{type:media.mimeType||mime||"audio/webm"}));}
  media.ondataavailable=e=>{if(e.data&&e.data.size)chunks.push(e.data);};
  media.onerror=()=>end(new Error("録音エラー"));
  media.onstop=()=>end(null);
  try{media.start();status("録音中（5秒）");timer=setTimeout(()=>{if(media.state!=="inactive")media.stop();},5000);}
  catch(e){end(e);}
 });
}
function renderRecordings(){
 const list=$("results");list.replaceChildren();
 recordings.forEach((item,i)=>{
  const li=document.createElement("li");const label=document.createElement("div");
  label.textContent="第"+(i+1)+"問｜想定回答："+questions[item.question].expected+"｜録音 "+Math.round(item.blob.size/1024)+" KB";
  const audio=document.createElement("audio");audio.controls=true;audio.src=item.url;
  li.append(label,audio);list.append(li);
 });
}
function finish(message){active=false;buttons(false);releaseStream();status(message);}
async function start(){
 if(active)return;
 currentUrls.forEach(url=>URL.revokeObjectURL(url));currentUrls=[];recordings=[];renderRecordings();$("log").textContent="";
 const token=++runId;active=true;buttons(true);
 try{
  // Request microphone inside the user's click so browsers can grant permission.
  status("マイク利用の許可を確認中");
  const permissionStream=await navigator.mediaDevices.getUserMedia({audio:true});
  permissionStream.getTracks().forEach(t=>t.stop());
  if(token!==runId)return;
  for(let i=0;i<questions.length;i++){
   if(token!==runId)return;
   showQuestion(i);
   status("第"+(i+1)+"問：読み上げ中");
   await speak(questions[i].text,token);
   if(token!==runId)return;
   await wait(250);
   if(token!==runId)return;
   status("回答開始の案内を読み上げ中");
   await speak("どうぞ",token);
   if(token!==runId)return;
   await wait(180);
   if(token!==runId)return;
   const blob=await capture(token);
   if(token!==runId)return;
   const url=URL.createObjectURL(blob);currentUrls.push(url);
   recordings.push({question:i,blob,url});renderRecordings();
   status("第"+(i+1)+"問：録音を受け付けました");
   if(i+1<questions.length)await wait(800);
  }
  if(token===runId)finish("3問完了。録音を再生して確認してください。");
 }catch(e){
  if(token===runId){cleanup();finish("停止しました："+(e?.message||String(e)));log("端末・OS・ブラウザと最後のログを控えてください");}
 }
}
$("start").addEventListener("click",start);
$("stop").addEventListener("click",()=>{++runId;cleanup();finish("手動で中止しました");});
window.addEventListener("pagehide",()=>{++runId;cleanup();});
const supported=Boolean(navigator.mediaDevices?.getUserMedia&&window.MediaRecorder&&window.speechSynthesis&&window.SpeechSynthesisUtterance&&window.isSecureContext);
$("support").textContent=supported?"必要なブラウザ機能を検出しました（動作保証ではありません）。":"このブラウザでは必要機能が利用できません。HTTPSとマイク対応ブラウザを確認してください。";
$("start").disabled=!supported;
</script></body></html>
